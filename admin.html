<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · BD Follower Selling</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172033;font-family:"Hind Siliguri",sans-serif}.wrap{max-width:850px;margin:auto;padding:18px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{font-size:23px;font-weight:700}a{color:#087e55}
.card{background:#fff;border:1px solid #e1e7ef;border-radius:14px;padding:16px;margin:12px 0}.hidden{display:none!important}
input,select{width:100%;padding:10px;border:1px solid #ccd5e1;border-radius:8px;font:inherit;margin:5px 0 12px}
button{border:0;border-radius:9px;padding:10px 15px;background:#087e55;color:white;font:600 15px inherit;cursor:pointer}
button.secondary{background:#e8edf3;color:#263247}button.danger{background:#b42318}
label{font-weight:600;font-size:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.muted{color:#667085;font-size:13px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.service{display:grid;grid-template-columns:1.3fr .8fr .8fr auto;gap:8px;align-items:end}
@media(max-width:620px){.service{grid-template-columns:1fr 1fr}.service .wide{grid-column:1/-1}.row{grid-template-columns:1fr}}
</style></head><body><main class="wrap">
<header><div class="brand">BD Follower Selling · Admin</div><a href="index.html">ওয়েবসাইট দেখুন</a></header>
<section class="card" id="loginBox"><h2>Admin Login</h2><label>ইমেইল</label><input id="email" type="email" placeholder="Admin email"><label>পাসওয়ার্ড</label><input id="password" type="password" placeholder="Password"><button id="login">লগইন</button><p class="muted" id="loginMsg"></p></section>
<section id="panel" class="hidden">
<div class="topline"><h2>সার্ভিস ও দাম</h2><button class="secondary" id="logout">Logout</button></div>
<div class="card"><h3>নতুন সার্ভিস যোগ করুন</h3><div class="row">
<div><label>প্ল্যাটফর্ম</label><select id="newPlatform"><option value="facebook">Facebook</option><option value="youtube">YouTube</option><option value="instagram">Instagram</option></select></div>
<div><label>সার্ভিসের নাম</label><input id="newTitle" placeholder="যেমন: ফলোয়ার"></div>
<div><label>প্রতি ১টির দাম (৳)</label><input id="newRate" type="number" step=".01" min=".01" placeholder="যেমন: 0.60"></div>
<div><label>প্যাকেজ (কমা দিয়ে)</label><input id="newQty" value="100,500,1000,5000"></div>
</div><button id="add">সার্ভিস যোগ করুন</button><p class="muted" id="addMsg"></p></div>
<div class="card"><h3>বর্তমান সার্ভিস</h3><p class="muted">নাম, প্রতি ইউনিটের দাম ও প্যাকেজ বদলে সেভ করুন।</p><div id="list">লোড হচ্ছে...</div></div>
<div class="card"><h3>WhatsApp নম্বর</h3><label>দেশের কোডসহ নম্বর</label><input id="wa" value="8801891827498"><button id="saveWa">নম্বর সেভ করুন</button><p class="muted" id="waMsg"></p></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<script>
const C=window.APP_CONFIG||{};const sb=C.supabaseUrl&&C.supabaseKey?supabase.createClient(C.supabaseUrl,C.supabaseKey):null;
const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
if(!sb){$("loginMsg").textContent="config.js-এ Supabase URL ও Publishable Key বসাতে হবে।"}
else{sb.auth.getSession().then(({data})=>show(!!data.session));sb.auth.onAuthStateChange((_e,s)=>show(!!s))}
function show(on){$("loginBox").classList.toggle("hidden",on);$("panel").classList.toggle("hidden",!on);if(on){load();loadWa()}}
$("login").onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});$("loginMsg").textContent=error?"লগইন হয়নি। ইমেইল ও পাসওয়ার্ড দেখুন।":""};
$("logout").onclick=()=>sb.auth.signOut();
async function load(){const {data,error}=await sb.from("services").select("*").order("platform").order("sort");if(error){$("list").textContent="লোড হয়নি। SQL সেটআপ ও Admin email পরীক্ষা করুন।";return}
$("list").innerHTML=(data||[]).map(s=>`<div class="card service" data-id="${s.id}"><div class="wide"><label>${esc(s.platform)}</label><input class="title" value="${esc(s.title)}"></div><div><label>প্রতি ১টির দাম</label><input class="rate" type="number" min=".01" step=".01" value="${esc(s.rate)}"></div><div><label>প্যাকেজ</label><input class="qty" value="${esc((s.qty||[]).join(","))}"></div><div><button class="save">সেভ</button><button class="danger del">মুছুন</button></div></div>`).join("")||"কোনো সার্ভিস নেই"}
$("list").onclick=async e=>{const box=e.target.closest("[data-id]");if(!box)return;const id=Number(box.dataset.id);
if(e.target.classList.contains("save")){const title=box.querySelector(".title").value.trim(),rate=Number(box.querySelector(".rate").value),qty=box.querySelector(".qty").value.split(",").map(x=>parseInt(x.trim(),10)).filter(x=>x>0);if(!title||!(rate>0)||!qty.length){alert("নাম, দাম ও প্যাকেজ ঠিকভাবে দিন।");return}const {error}=await sb.from("services").update({title,rate,qty}).eq("id",id);alert(error?"সেভ হয়নি":"সেভ হয়েছে");if(!error)load()}
if(e.target.classList.contains("del")){if(!confirm("এই সার্ভিসটি মুছবেন?"))return;const {error}=await sb.from("services").delete().eq("id",id);alert(error?"মুছতে পারেনি":"মুছে ফেলা হয়েছে");if(!error)load()}};
$("add").onclick=async()=>{const platform=$("newPlatform").value,title=$("newTitle").value.trim(),rate=Number($("newRate").value),qty=$("newQty").value.split(",").map(x=>parseInt(x.trim(),10)).filter(x=>x>0);if(!title||!(rate>0)||!qty.length){$("addMsg").textContent="সব তথ্য ঠিকভাবে পূরণ করুন।";return}const {error}=await sb.from("services").insert({platform,title,hint:platform,rate,qty,sort:99,active:true});$("addMsg").textContent=error?"যোগ হয়নি।":"সার্ভিস যোগ হয়েছে।";if(!error){$("newTitle").value="";load()}};
async function loadWa(){const {data}=await sb.from("settings").select("*").eq("key","whatsapp").maybeSingle();if(data?.value)$("wa").value=data.value}
$("saveWa").onclick=async()=>{const {error}=await sb.from("settings").upsert({key:"whatsapp",value:$("wa").value.replace(/\D/g,"")});$("waMsg").textContent=error?"সেভ হয়নি":"নম্বর সেভ হয়েছে।";};
</script></body></html>
