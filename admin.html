<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BD Follower Selling - Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#f1f5f9;font-family:Arial}
.container{max-width:600px;margin:auto}
.card{background:white;padding:20px;border-radius:14px;margin:15px 0;box-shadow:0 3px 12px #ddd}
h2{color:#1877f2;text-align:center}
input,textarea{width:100%;padding:13px;margin:8px 0;border:1px solid #ccc;border-radius:8px}
button{padding:12px 18px;border:0;border-radius:8px;background:#1877f2;color:white;margin:5px;cursor:pointer}
.delete{background:#dc2626}
.edit{background:#16a34a}
.hidden{display:none}
.item{border:1px solid #ddd;padding:12px;border-radius:9px;margin:10px 0}
</style>
</head>
<body>
<div class="container">

<h2>BD Follower Selling</h2>
<p style="text-align:center">Admin Dashboard</p>

<div class="card" id="loginBox">
<h3>Admin Login</h3>
<input id="email" type="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="loginMsg"></p>
</div>

<div class="hidden" id="dashboard">
<div class="card">
<h3>নতুন সার্ভিস যোগ করুন</h3>
<input id="title" placeholder="সার্ভিসের নাম">
<textarea id="description" placeholder="সার্ভিসের বিবরণ"></textarea>
<input id="price" type="number" placeholder="দাম">
<button onclick="saveService()">সেভ করুন</button>
<button onclick="logout()" style="background:#555">Logout</button>
<p id="msg"></p>
</div>

<div class="card">
<h3>সার্ভিস তালিকা</h3>
<div id="serviceList">Loading...</div>
</div>
</div>

</div>

<script>
const ADMIN_EMAIL = "ariyanhossenrakib86@gmail.com";

const db = window.supabase.createClient(
  window.APP_CONFIG.supabaseUrl,
  window.APP_CONFIG.supabaseKey
);

let editingId = null;

async function login(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const {data,error} = await db.auth.signInWithPassword({
    email,password
  });

  if(error){
    document.getElementById("loginMsg").innerText = error.message;
    return;
  }

  if(data.user.email !== ADMIN_EMAIL){
    await db.auth.signOut();
    document.getElementById("loginMsg").innerText = "আপনি Admin নন!";
    return;
  }

  showDashboard();
}

function showDashboard(){
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");
  loadServices();
}

async function logout(){
  await db.auth.signOut();
  location.reload();
}

async function saveService(){
  const title = document.getElementById("title").value.trim();
  const description = document.getElementById("description").value.trim();
  const price = document.getElementById("price").value;

  if(!title || price === ""){
    alert("নাম এবং দাম লিখুন");
    return;
  }

  const service = {
    title,
    description,
    price:Number(price),
    active:true
  };

  let result;

  if(editingId){
    result = await db.from("services")
      .update(service).eq("id",editingId);
  }else{
    result = await db.from("services").insert(service);
  }

  if(result.error){
    alert(result.error.message);
    return;
  }

  editingId = null;
  document.getElementById("title").value = "";
  document.getElementById("description").value = "";
  document.getElementById("price").value = "";
  document.getElementById("msg").innerText = "সেভ হয়েছে!";
  loadServices();
}

async function loadServices(){
  const {data,error} = await db.from("services")
    .select("*").order("id",{ascending:false});

  const list = document.getElementById("serviceList");

  if(error){
    list.innerText = error.message;
    return;
  }

  list.innerHTML = "";

  data.forEach(item=>{
    const div = document.createElement("div");
    div.className = "item";

    const name = document.createElement("b");
    name.textContent = item.title;

    const details = document.createElement("p");
    details.textContent = item.description + " | দাম: ৳" + item.price;

    const editBtn = document.createElement("button");
    editBtn.className = "edit";
    editBtn.textContent = "Edit";
    editBtn.onclick = ()=>editService(item);

    const deleteBtn = document.createElement("button");
    deleteBtn.className = "delete";
    deleteBtn.textContent = "Delete";
    deleteBtn.onclick = ()=>deleteService(item.id);

    div.append(name,details,editBtn,deleteBtn);
    list.appendChild(div);
  });
}

function editService(item){
  editingId = item.id;
  document.getElementById("title").value = item.title;
  document.getElementById("description").value = item.description;
  document.getElementById("price").value = item.price;
  window.scrollTo(0,0);
}

async function deleteService(id){
  if(!confirm("এই সার্ভিসটি মুছে ফেলবেন?")) return;

  const {error} = await db.from("services").delete().eq("id",id);

  if(error){
    alert(error.message);
    return;
  }

  loadServices();
}

async function checkLogin(){
  const {data} = await db.auth.getSession();

  if(data.session && data.session.user.email === ADMIN_EMAIL){
    showDashboard();
  }
}

checkLogin();
</script>
</body>
</html>
